
services:

  db:
    image: postgres:17-alpine
    container_name: todo-db

    environment:
      POSTGRES_DB: ${DB_NAME:-todo_app}
      POSTGRES_USER: ${DB_USERNAME:-todo_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-todo_password}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-todo_app} -d ${DB_NAME:-todo_app}"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: todo-backend

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-todo_app}
      DB_USERNAME: ${DB_USERNAME:-todo_app}
      DB_PASSWORD: ${DB_PASSWORD:-todo_password}

    ports:
      - "8080:8080"

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: todo-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped

volumes:
  postgres_data:
