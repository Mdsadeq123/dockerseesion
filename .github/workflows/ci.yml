
name: Todo Application CI

# --------------------------------------------------
# TRIGGERS
# --------------------------------------------------

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

# --------------------------------------------------
# GLOBAL CONFIGURATION
# --------------------------------------------------

permissions:
  contents: read

concurrency:
  group: todo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# --------------------------------------------------
# JOBS
# --------------------------------------------------

jobs:

  # ================================================
  # FRONTEND CI
  # ================================================

  frontend-ci:

    name: Frontend CI

    runs-on: ubuntu-latest

    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:

      # Step 1: Checkout repository

      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Configure Node.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Step 3: Install dependencies

      - name: Install frontend dependencies
        run: npm ci

      # Step 4: Run lint checks

      - name: Run ESLint
        run: npm run lint

      # Step 5: Build frontend

      - name: Build React application
        run: npm run build

      # Step 6: Upload build output

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7


  # ================================================
  # BACKEND CI
  # ================================================

  backend-ci:

    name: Backend CI

    runs-on: ubuntu-latest

    timeout-minutes: 25

    services:

      # PostgreSQL database for integration tests

      postgres:

        image: postgres:16-alpine

        env:
          POSTGRES_DB: todo_app
          POSTGRES_USER: todo_app
          POSTGRES_PASSWORD: ci_test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U todo_app -d todo_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: todo_app
      DB_USERNAME: todo_app
      DB_PASSWORD: ci_test_password

    steps:

      # Step 1: Checkout repository

      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Setup Java

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Step 3: Make Maven wrapper executable

      - name: Configure Maven wrapper
        run: chmod +x ./mvnw

      # Step 4: Validate Maven project

      - name: Validate Maven project
        run: ./mvnw -B -ntp validate

      # Step 5: Compile backend

      - name: Compile Spring Boot application
        run: ./mvnw -B -ntp compile

      # Step 6: Run tests and verification

      - name: Run backend tests
        run: ./mvnw -B -ntp verify

      # Step 7: Upload test reports

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7
