name: CD PIPELINE

on:
    workflow_call:
    workflow_dispatch:

jobs:
    deploy:
        runs-on: self-hosted
        steps:
            - name: Checkout repo
              uses: actions/checkout@v7

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Deployment
              run: |
                docker compose pull
                docker compose up -d