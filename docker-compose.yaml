
services:

  # PostgreSQL database

  db:
    image: postgres:16-alpine

    container_name: todo-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: todo_app
      POSTGRES_USER: todo_app
      POSTGRES_PASSWORD: sadeq

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USERNAME:-todo_app} -d ${DB_NAME:-todo_app}
      interval: 10s
      timeout: 5s
      retries: 5


  # Spring Boot backend

  backend:
    image: ${{ secrets.DOCKERHUB_USERNAME }}/backend:${IMAGE_TAG:-latest}

    container_name: todo-backend

    restart: unless-stopped

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: todo_app
      DB_USERNAME: todo_app
      DB_PASSWORD: sadeq
    depends_on:
      db:
        condition: service_healthy

    expose:
      - "8080"


  # React frontend

  frontend:
    image: ${{ secrets.DOCKERHUB_USERNAME }}/frontend:${IMAGE_TAG:-latest}

    container_name: todo-frontend

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend


volumes:
  postgres_data:
